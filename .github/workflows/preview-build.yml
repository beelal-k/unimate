name: Android Preview Build

on:
  push:
    branches:
      - master
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── 1. Bump version, generate changelog ──────────────────────────────────
  version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    defaults:
      run:
        working-directory: ./app
    outputs:
      app_version: ${{ steps.read_version.outputs.value }}
      changelog: ${{ steps.changelog.outputs.text }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version
        run: npm version patch --no-git-tag-version

      - name: Read new version
        id: read_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" | grep -E "^- (feat|fix|chore)(\(.+\))?:" | head -20)
          else
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" | grep -E "^- (feat|fix|chore)(\(.+\))?:")
          fi
          EOF_MARKER=$(openssl rand -hex 8)
          echo "text<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT

      - name: Upload bumped package files
        uses: actions/upload-artifact@v4
        with:
          name: version-bump
          path: |
            app/package.json
            app/package-lock.json

  # ─── 2. EAS build + download APK ──────────────────────────────────────────
  build:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Apply version bump
        uses: actions/download-artifact@v4
        with:
          name: version-bump
          path: app/

      - name: Trigger EAS Android Build
        run: eas build -p android --profile preview --non-interactive

      - name: Download APK from EAS
        run: |
          ARTIFACT_URL=$(eas build:list --platform android --profile preview --status finished --limit 1 --non-interactive --json | jq -r '.[0].artifacts.buildUrl')
          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" == "null" ]; then
            echo "Error: Could not retrieve artifact URL."
            exit 1
          fi
          curl -L -o app-preview.apk "$ARTIFACT_URL"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/app-preview.apk

  # ─── 3. Create GitHub release and attach APK ──────────────────────────────
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.app_version }}
          name: "v${{ needs.version.outputs.app_version }}"
          body: |
            ## What's new in v${{ needs.version.outputs.app_version }}

            ${{ needs.version.outputs.changelog }}

            ---
            Built from commit ${{ github.sha }}
          draft: false
          prerelease: true
          files: app-preview.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 4. Update PostHog feature flag ───────────────────────────────────────
  notify:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Update PostHog feature flag
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.app_version }}/app-preview.apk"

          BODY=$(jq -n \
            --arg version "${{ needs.version.outputs.app_version }}" \
            --arg url "$DOWNLOAD_URL" \
            --arg notes "Update to v${{ needs.version.outputs.app_version }}. See release notes on GitHub." \
            '{
              active: true,
              filters: {
                groups: [{ properties: [], rollout_percentage: 100 }],
                payloads: {
                  "true": ({ latest_version: $version, download_url: $url, release_notes: $notes } | tojson)
                }
              }
            }')

          HTTP_CODE=$(curl -s -o /tmp/posthog_response.json -w "%{http_code}" \
            -X PATCH "https://us.posthog.com/api/projects/${{ secrets.POSTHOG_PROJECT_ID }}/feature_flags/${{ secrets.POSTHOG_FLAG_ID }}/" \
            -H "Authorization: Bearer ${{ secrets.POSTHOG_PERSONAL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "PostHog API response: $HTTP_CODE"
          cat /tmp/posthog_response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PostHog flag update failed with HTTP $HTTP_CODE"
            exit 1
          fi

  # ─── 5. Commit version bump back to master ────────────────────────────────
  commit:
    needs: [version, notify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bumped package files
        uses: actions/download-artifact@v4
        with:
          name: version-bump
          path: app/

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json
          git commit -m "chore: bump version to v${{ needs.version.outputs.app_version }} [skip ci]"
          git push
