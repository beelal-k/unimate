name: Android Preview Build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔢 Bump patch version
        run: npm version patch --no-git-tag-version

      - name: 📌 Read new version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" | head -20)
          else
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s")
          fi
          # Escape for GitHub env multiline
          EOF_MARKER=$(openssl rand -hex 8)
          echo "CHANGELOG<<$EOF_MARKER" >> $GITHUB_ENV
          echo "$LOG" >> $GITHUB_ENV
          echo "$EOF_MARKER" >> $GITHUB_ENV

      - name: 🚀 Trigger EAS Android Build
        run: eas build -p android --profile preview --non-interactive

      - name: 📥 Download APK Artifact
        run: |
          ARTIFACT_URL=$(eas build:list --platform android --profile preview --status finished --limit 1 --non-interactive --json | jq -r '.[0].artifacts.buildUrl')

          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" == "null" ]; then
            echo "Error: Could not retrieve artifact URL."
            exit 1
          fi

          curl -L -o app-preview.apk "$ARTIFACT_URL"

      - name: 📢 Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "v${{ env.APP_VERSION }}"
          body: |
            ## What's new in v${{ env.APP_VERSION }}

            ${{ env.CHANGELOG }}

            ---
            Built from commit ${{ github.sha }}
          draft: false
          prerelease: true
          files: app/app-preview.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚩 Update PostHog feature flag
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ env.APP_VERSION }}/app-preview.apk"

          # Build the full PATCH body with jq to avoid shell escaping issues.
          # groups[].rollout_percentage must be 100 or the flag returns false for all users.
          BODY=$(jq -n \
            --arg version "${{ env.APP_VERSION }}" \
            --arg url "$DOWNLOAD_URL" \
            --arg notes "Update to v${{ env.APP_VERSION }}. See release notes on GitHub." \
            '{
              active: true,
              filters: {
                groups: [{ properties: [], rollout_percentage: 100 }],
                payloads: {
                  "true": ({ latest_version: $version, download_url: $url, release_notes: $notes } | tojson)
                }
              }
            }')

          HTTP_CODE=$(curl -s -o /tmp/posthog_response.json -w "%{http_code}" \
            -X PATCH "https://us.posthog.com/api/projects/${{ secrets.POSTHOG_PROJECT_ID }}/feature_flags/${{ secrets.POSTHOG_FLAG_ID }}/" \
            -H "Authorization: Bearer ${{ secrets.POSTHOG_PERSONAL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "PostHog API response: $HTTP_CODE"
          cat /tmp/posthog_response.json

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PostHog flag update failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: 💾 Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${{ env.APP_VERSION }} [skip ci]"
          git push
